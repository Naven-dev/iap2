name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - main

jobs:
  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Run Integration Tests
        run:
          ./gradlew test

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build Jar
        run: ./gradlew clean assemble

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          docker build -t ghcr.io/${OWNER_LC}/order-api:latest .

      - name: Push Docker Image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          docker push ghcr.io/${OWNER_LC}/order-api:latest

# ==========================================
# SPRING APPLICATION CONFIGURATION
# ==========================================
spring.application.name=ORDER-SERVICE
server.port=8082
server.servlet.context-path=/api

# H2 Database Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# H2 In-Memory Database Configurations
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# EUREKA SERVICE DISCOVERY CONFIGURATION
# ==========================================
# Enables the verification check of Spring Cloud compatibility
spring.cloud.compatibility-verifier.enabled=false

# ==========================================
# RESILIENCE4J CONFIGURATION (Circuit Breaker & Retry)
# ==========================================

# 1. Retry with Exponential Backoff Configuration
resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=2s
resilience4j.retry.instances.productService.enable-exponential-backoff=true
resilience4j.retry.instances.productService.exponential-backoff-multiplier=2

# 2. Circuit Breaker Configuration
# If 50% of requests fail over a window of 10 calls, open the circuit and stop sending traffic.
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3


# Re-enable Eureka discovery registration
eureka.client.register-with-eureka=True
eureka.client.fetch-registry=True

# ROUTING FIX: Routes container traffic safely back to the Eureka Server on your desktop
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
